  <text x="181.0" y="159.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">Search Barcode</text>

  <line x1="175" y1="236" x2="175" y2="270" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow)"/>
