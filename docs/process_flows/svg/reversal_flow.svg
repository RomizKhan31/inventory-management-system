    <rect x="95" y="0" width="12" height="12" rx="3" fill="#FFA000"/>
    <text x="113" y="10" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#E2E8F0">Validation</text>

