    <rect x="58" y="186" width="116.39999999999999" height="14" rx="3" fill="#7E57C2"/>
    <text x="62" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">DATABASE OPERATION</text>
    <text x="62" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4A148C">Fetch Full Event Journey</text>
