  <line x1="300" y1="298" x2="350" y2="298" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="331.0" y="294.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">Reverse Delivery</text>

  <line x1="570" y1="298" x2="630" y2="298" stroke="#D32F2F" stroke-width="1.8" marker-end="url(#arrow-err)"/>
  <text x="606.0" y="294.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#D32F2F">Invalid State</text>

  <line x1="460" y1="326" x2="460" y2="360" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arrow-succ)"/>
  <text x="466.0" y="339.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2E7D32">Eligible</text>

  <line x1="460" y1="416" x2="460" y2="450" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arrow-succ)"/>
  <text x="466.0" y="429.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2E7D32">Reason Valid</text>

  <path d="M 175 326 L 175 568 L 350 568" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="185" y="450" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">Reverse Receive</text>

  <line x1="570" y1="568" x2="630" y2="568" stroke="#D32F2F" stroke-width="1.8" marker-end="url(#arrow-err)"/>
  <text x="606.0" y="564.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#D32F2F">Unit Delivered</text>

  <line x1="460" y1="596" x2="460" y2="630" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#arrow-succ)"/>
  <text x="466.0" y="609.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2E7D32">Eligible & Reason OK</text>
</svg>