    <text x="308" y="10" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#E2E8F0">Success TX</text>

    <rect x="385" y="0" width="12" height="12" rx="3" fill="#D32F2F"/>
    <text x="403" y="10" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#E2E8F0">Reject / Error</text>
  </g>


  <g filter="url(#shadow)">
