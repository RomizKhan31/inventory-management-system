    <rect x="358" y="276" width="110.6" height="14" rx="3" fill="#FFA000"/>
    <text x="362" y="286" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">SYSTEM VALIDATION</text>
    <text x="362" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E65100">Reverse Delivery Check</text>
