  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="540" width="220" height="56" rx="6" fill="#FFEBEE" stroke="#D32F2F" stroke-width="1.8"/>
    <rect x="638" y="546" width="116.39999999999999" height="14" rx="3" fill="#D32F2F"/>
    <text x="642" y="556" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">REJECT / EXCEPTION</text>
    <text x="642" y="572" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B71C1C">Reject: Already Delivered!</text>
    <text x="642" y="584" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">Must reverse delivery first</text>
  </g>

  <g filter="url(#shadow)">
