    <rect x="358" y="636" width="122.2" height="14" rx="3" fill="#388E3C"/>
    <text x="362" y="646" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">SUCCESS TRANSACTION</text>
    <text x="362" y="662" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1B5E20">Append REVERSED_RECEIVE</text>
    <text x="362" y="674" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">Unit reverts to TRACKED (leaves stock)</text>
  </g>

