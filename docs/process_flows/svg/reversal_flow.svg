    <text x="362" y="482" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1B5E20">Append REVERSED_DELIVERY</text>
    <text x="362" y="494" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">Restores unit to original Receive Point</text>
  </g>

